name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain, pinned by commit (same pin as ci.yml). The previous
        # value named an action that does not exist, so this job failed at "Set up job".
        # Toolchain matches rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: nightly-2024-10-01
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos
        run: cargo install cargo-leptos --version 0.3.9 --locked

      - name: Install Tailwind CLI
        # Exact release + published checksum. `releases/latest` now resolves to
        # Tailwind 4, whose standalone CLI does not read this project's v3
        # tailwind.config.js or the `@tailwind base` directives in styles/app.css.
        env:
          TAILWIND_VERSION: v3.4.19
          TAILWIND_SHA256: 4af3198c015616ea7d6617974ec3d70d987ecc00c1ca8463b0a30fd65cc7c06e
        run: |
          curl -fsSL -o tailwindcss-linux-x64 \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWIND_SHA256}  tailwindcss-linux-x64" | sha256sum -c -
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss
          tailwindcss --help | head -1

      - name: Build release
        run: cargo leptos build --release

      - name: Create release archive
        run: |
          mkdir -p release
          cp -r target/site release/
          cp -r target/release/real-time-resume release/ 2>/dev/null || true
          tar -czvf real-time-resume-${{ github.ref_name }}.tar.gz release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: real-time-resume-${{ github.ref_name }}
          path: real-time-resume-${{ github.ref_name }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: real-time-resume-${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: real-time-resume-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
